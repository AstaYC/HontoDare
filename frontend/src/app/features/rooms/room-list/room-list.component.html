<!-- src/app/features/rooms/room-list/room-list.component.html -->
<div class="flex justify-center items-center h-screen bg-gray-100">
  <div class="w-full max-w-4xl bg-white p-8 rounded-lg shadow-md space-y-6">
    <h2 class="text-2xl font-semibold text-gray-700 text-center">Select a Room</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div *ngFor="let room of rooms" class="bg-gray-50 p-4 rounded-lg shadow-md">
        <h3 class="text-lg font-medium text-gray-900">{{ room.name }}</h3>
        <p class="text-gray-600">{{ room.description }}</p>
        <p class="text-gray-600">Category: {{ room.category }}</p>
        <p class="text-gray-600">Max Players: {{ room.maxPlayers }}</p>
        <button
          (click)="joinRoom(room.id)"
          class="w-full mt-4 py-2 px-4 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500 transition duration-300 ease-in-out"
        >
          Join Room
        </button>
      </div>
    </div>
  </div>
</div>
