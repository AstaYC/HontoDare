<!-- src/app/features/rooms/room-list/room-list.component.html -->
<app-navbar></app-navbar>
<div class="min-h-screen bg-black text-white py-16">
  <div class="container mx-auto px-4">
    <!-- Header -->
    <div class="text-center mb-12">
      <h2 class="font-kill-the-noise text-4xl text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-red-400 transform -skew-x-12 mb-4">
        SELECT A ROOM
      </h2>
      <div class="h-1 w-48 mx-auto bg-red-600 mb-6"></div>
      <p class="font-samurai text-gray-400 max-w-2xl mx-auto">
        Choose a themed room that matches your interests and knowledge
      </p>
    </div>

    <!-- Room Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
      <div *ngFor="let room of rooms; let i = index"
           class="bg-gray-900 border border-gray-800 hover:border-red-600 transition-all duration-300 group overflow-hidden">
        <!-- Room header with image -->
        <!-- Room header with image -->
        <div class="h-40 bg-gradient-to-br from-red-900 to-black relative overflow-hidden">
          <!-- Background texture -->
          <div class="absolute inset-0 opacity-30 bg-cover bg-center"
               [style.background-image]="'url(/assets/img/texture-bg.jpg)'"></div>

          <!-- Room image if available -->
          <div *ngIf="room.roomPicUrl" class="absolute inset-0">
            <img [src]="getImageUrl(room.roomPicUrl)" alt="{{ room.name }}"
                 class="w-full h-full object-cover opacity-80">
          </div>

          <!-- Room icon/logo - only show if no image -->
          <div *ngIf="!room.roomPicUrl" class="absolute inset-0 flex items-center justify-center">
            <i class="fas"
               [ngClass]="{
         'fa-dragon': room.category === 'Anime',
         'fa-mask': room.category === 'Comics',
         'fa-film': room.category === 'Movies',
         'fa-gamepad': room.category === 'Games',
         'fa-book': room.category === 'Books',
         'fa-tv': room.category === 'TV Shows',
         'fa-globe': !['Anime', 'Comics', 'Movies', 'Games', 'Books', 'TV Shows'].includes(room.category)
       }"
               class="text-red-500 text-5xl group-hover:scale-110 transition-transform duration-300"></i>
          </div>

          <!-- Decorative elements -->
          <div class="absolute top-0 right-0 w-20 h-20 bg-red-600 transform rotate-45 translate-x-8 -translate-y-8 opacity-50"></div>
          <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 to-transparent"></div>
        </div>
        <!-- Room content -->
        <div class="p-6">
          <h3 class="font-kill-the-noise text-xl text-red-500 mb-2 transform -skew-x-6">
            {{ room.name }}
          </h3>
          <p class="font-samurai text-gray-400 text-sm mb-4">{{ room.description }}</p>

          <!-- Room details -->
          <div class="grid grid-cols-2 gap-2 mb-6">
            <div class="bg-gray-800 p-2 text-center">
              <span class="text-xs text-gray-500 block">CATEGORY</span>
              <span class="font-samurai text-gray-300">{{ room.category }}</span>
            </div>
            <div class="bg-gray-800 p-2 text-center">
              <span class="text-xs text-gray-500 block">MAX PLAYERS</span>
              <span class="font-samurai text-gray-300">{{ room.maxPlayers }}</span>
            </div>
          </div>

          <!-- Join button -->
          <button
            (click)="joinRoom(room.id)"
            class="w-full py-3 px-4 font-kill-the-noise bg-gradient-to-r from-red-800 to-red-600 hover:from-red-900 hover:to-red-700 text-white border-0 transition-all duration-300 transform hover:translate-y-[-2px] flex items-center justify-center"
          >
            JOIN BATTLE
            <i class="fas fa-chevron-right ml-2"></i>
          </button>
        </div>
      </div>

      <!-- Empty state if no rooms -->
      <div *ngIf="rooms.length === 0" class="col-span-full text-center py-12">
        <i class="fas fa-door-closed text-red-500 text-5xl mb-4"></i>
        <h3 class="font-kill-the-noise text-xl text-red-500 mb-2">NO ROOMS AVAILABLE</h3>
        <p class="font-samurai text-gray-400">Check back later for available rooms</p>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
