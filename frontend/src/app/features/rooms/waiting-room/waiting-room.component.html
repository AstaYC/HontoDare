<!-- src/app/features/rooms/waiting-room/waiting-room.component.html -->
<div class="flex justify-center items-center h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md space-y-6">
    <h2 class="text-2xl font-semibold text-gray-700 text-center">Waiting Room</h2>
    <p class="text-gray-600 text-center">Please wait for another player to join...</p>
    <div class="mt-4">
      <h3 class="text-lg font-medium text-gray-900">Players in Room:</h3>
      <ul class="list-disc pl-6">
        <li *ngFor="let player of players">
          {{ player.username || player.name || 'Player ' + player.userId }}
        </li>
      </ul>
    </div>
    <div class="flex justify-center">
      <button
        (click)="leaveRoom()"
        class="py-2 px-4 bg-red-600 text-white rounded-lg hover:bg-red-500 transition duration-300 ease-in-out"
      >
        Leave Room
      </button>
    </div>
  </div>
</div>
