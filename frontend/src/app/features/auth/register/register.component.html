<!-- src/app/features/auth/register/register.component.html -->

<!-- Luffy standing on the form -->

  <div class="absolute z-20 ">
    <img style="max-width: 60% ; margin-top : 27% ; margin-left: 355%;" src="/assets/img/idiot.png" alt="Luffy">
  </div>

<div class="min-h-screen bg-black text-white flex justify-center items-center relative overflow-hidden">
  <!-- Background decorations -->
  <div class="absolute inset-0 bg-cover bg-center opacity-15" style="background-image: url('/assets/img/dragon killer.jpg')"></div>

  <!-- Red slash decorations -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-red-600 rotate-12 opacity-20"></div>
    <div class="absolute top-40 right-0 w-72 h-72 bg-red-700 -rotate-12 opacity-20"></div>
    <div class="absolute bottom-0 left-1/3 w-80 h-80 bg-red-800 rotate-45 opacity-10"></div>
  </div>

  <!-- Floating characters -->
  <div class="absolute top-20 left-10 animate-float-slow hidden lg:block">
    <div class="w-32 h-32 rounded-full bg-gradient-to-r from-red-600 to-red-500 shadow-lg shadow-red-900/50 flex items-center justify-center">
      <img src="/assets/img/natsuandhappay.gif" alt="Character" class="rounded-full">
    </div>
  </div>
  <div class="absolute bottom-20 right-10 animate-float hidden lg:block">
    <div class="w-32 h-32 rounded-full bg-gradient-to-r from-red-600 to-red-500 shadow-lg shadow-red-900/50 flex items-center justify-center">
      <img src="/assets/img/luffy.jpg" alt="Character" class="rounded-full">
    </div>
  </div>


  <!-- Register container -->
  <div class="w-full max-w-md relative z-10">
    <div class="relative">
      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <img class="h-auto max-h-24 w-auto mb-4 animate-pulse-slow" src="assets/img/HontoDare.png" alt="HontoDare Logo">
        <div class="h-1 w-48 mx-auto bg-red-600 mb-6 transform -skew-x-12"></div>
      </div>

      <!-- Register form -->
      <div class="bg-gray-900/80 border border-red-900 shadow-lg shadow-red-900/20 p-8 backdrop-blur-sm">
        <h2 class="font-samurai text-3xl text-center mb-6 text-red-500 transform -skew-x-12">
          JOIN THE BATTLE
        </h2>

        <!-- Alert Messages -->
        <div *ngIf="successMessage" class="mb-4 p-3 bg-green-900/80 border border-green-600 text-green-400 rounded-none animate-fade-in">
          <i class="fas fa-check-circle mr-2"></i> {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-900/80 border border-red-600 text-red-400 rounded-none animate-fade-in">
          <i class="fas fa-exclamation-circle mr-2"></i> {{ errorMessage }}
        </div>

        <form (ngSubmit)="register()" class="space-y-6">

          <div class="form-group">
            <label for="name" class="font-samurai block text-sm font-medium mb-2 text-red-400">FULL NAME</label>
            <div class="relative">
              <input
                id="name"
                type="text"
                [(ngModel)]="name"
                name="name"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white input-field"
                placeholder="Enter your full name"
              />
              <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
            </div>
          </div>

          <!-- Username field -->
          <div class="form-group">
            <label for="username" class="font-samurai block text-sm font-medium mb-2 text-red-400">USERNAME</label>
            <div class="relative">
              <input
                id="username"
                type="text"
                [(ngModel)]="username"
                name="username"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white input-field"
                placeholder="Choose your warrior name"
              />
              <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
            </div>
          </div>

          <!-- Email field -->
          <div class="form-group">
            <label for="email" class="font-samurai block text-sm font-medium mb-2 text-red-400">EMAIL</label>
            <div class="relative">
              <input
                id="email"
                type="email"
                [(ngModel)]="email"
                name="email"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white input-field"
                placeholder="Enter your email"
              />
              <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
            </div>
          </div>

          <!-- Password field -->
          <div class="form-group">
            <label for="password" class="font-samurai block text-sm font-medium mb-2 text-red-400">PASSWORD</label>
            <div class="relative">
              <input
                id="password"
                type="password"
                [(ngModel)]="password"
                name="password"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white input-field"
                placeholder="Create your password"
              />
              <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
            </div>
          </div>

          <!-- Confirm Password field -->
          <div class="form-group">
            <label for="confirmPassword" class="font-samurai block text-sm font-medium mb-2 text-red-400">CONFIRM PASSWORD</label>
            <div class="relative">
              <input
                id="confirmPassword"
                type="password"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white input-field"
                placeholder="Confirm your password"
              />
              <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
            </div>
          </div>

          <!-- Submit button -->
          <button
            type="submit"
            class="w-full font-kill-the-noise bg-gradient-to-r from-red-800 to-red-600 hover:from-red-900 hover:to-red-700 text-white border-0 rounded-none px-8 py-4 text-lg font-bold tracking-wider transform hover:translate-y-[-2px] transition-transform inline-block login-btn"
          >
            <span class="relative z-10">
              CREATE WARRIOR
              <i class="fas fa-chevron-right ml-2"></i>
            </span>
          </button>

          <!-- Login link -->
          <div class="text-center mt-4">
            <p class="font-samurai text-gray-400 text-sm">
              Already a warrior?
              <a routerLink="/login" class="text-red-500 hover:text-red-400 transition-colors register-link">
                Return to battle
              </a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
