<!-- src/app/features/profile/profile.component.html -->
<div class="container mx-auto p-4 max-w-4xl">
  <div class="bg-gray-800 rounded-lg shadow-lg p-6 text-white">
    <h1 class="text-2xl font-bold mb-6">User Profile</h1>

    <div class="mb-6 flex flex-col md:flex-row items-center md:items-start">
      <div class="w-32 h-32 mr-6 mb-4 md:mb-0 rounded-full overflow-hidden bg-gray-700 flex items-center justify-center">
        <img *ngIf="previewUrl" [src]="previewUrl" alt="Profile" class="w-full h-full object-cover">
        <span *ngIf="!previewUrl" class="text-5xl text-gray-500">
          <i class="fas fa-user"></i>
        </span>
      </div>

      <div class="flex-1">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          <div class="mb-4">
            <label for="avatar" class="block text-sm font-medium mb-1">Profile Picture</label>
            <input
              type="file"
              id="avatar"
              class="block w-full text-sm text-gray-400
                     file:mr-4 file:py-2 file:px-4
                     file:rounded-full file:border-0
                     file:text-sm file:font-semibold
                     file:bg-blue-600 file:text-white
                     hover:file:bg-blue-700 cursor-pointer"
              (change)="onFileSelected($event)"
              accept="image/*">
          </div>

          <div class="mb-4">
            <label for="username" class="block text-sm font-medium mb-1">Username</label>
            <input
              type="text"
              id="username"
              formControlName="username"
              class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white">
          </div>

          <div class="mb-4">
            <label for="name" class="block text-sm font-medium mb-1">Full Name</label>
            <input
              type="text"
              id="name"
              formControlName="name"
              class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white">
          </div>

          <div class="mb-4">
            <label for="email" class="block text-sm font-medium mb-1">Email</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white">
          </div>

          <div class="mb-4">
            <label for="password" class="block text-sm font-medium mb-1">Change Password</label>
            <input
              type="password"
              id="password"
              formControlName="password"
              class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white"
              placeholder="Leave blank to keep current password">
          </div>

          <div class="mb-6">
            <label for="confirmPassword" class="block text-sm font-medium mb-1">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              formControlName="confirmPassword"
              class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white"
              placeholder="Confirm new password">
          </div>

          <div *ngIf="submitSuccess" class="mb-4 p-2 bg-green-600 text-white rounded">
            Profile updated successfully!
          </div>

          <div *ngIf="submitError" class="mb-4 p-2 bg-red-600 text-white rounded">
            {{ submitError }}
          </div>

          <div class="flex items-center">
            <button
              type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50"
              [disabled]="loading || !profileForm.valid">
              <span *ngIf="loading">
                <i class="fas fa-spinner fa-spin mr-2"></i>
                Saving...
              </span>
              <span *ngIf="!loading">Save Changes</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="mt-6 border-t border-gray-700 pt-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold">Game Statistics</h2>
          <p class="text-gray-400">Points: {{ user?.points || 0 }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
