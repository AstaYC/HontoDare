<app-navbar></app-navbar>

<div class="min-h-screen bg-black text-white py-16">
  <!-- Red slash decorations -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute top-40 -left-20 w-96 h-96 bg-red-600 rotate-12 opacity-10"></div>
    <div class="absolute bottom-40 right-0 w-72 h-72 bg-red-700 -rotate-12 opacity-10"></div>
  </div>

  <div class="container mx-auto px-4 max-w-4xl relative z-10">
    <div class="relative mb-8">
      <h1 class="font-samurai text-4xl text-center text-red-500 transform -skew-x-12">
        WARRIOR PROFILE
      </h1>
      <div class="h-1 w-48 mx-auto bg-red-600 mt-2"></div>
    </div>

    <div class="bg-gray-900 border border-red-900 shadow-lg p-8 rounded-none">
      <div class="mb-8 flex flex-col md:flex-row items-center md:items-start">
        <!-- Avatar Section -->
        <div class="w-40 h-40 mr-8 mb-6 md:mb-0 relative group">
          <div class="absolute inset-0 bg-gradient-to-br from-red-900 to-black rounded-full shadow-lg shadow-red-900/30 animate-pulse-slow"></div>
          <div class="w-40 h-40 rounded-full overflow-hidden border-2 border-red-600 relative z-10 bg-gray-800 flex items-center justify-center">
            <img *ngIf="previewUrl" [src]="previewUrl" alt="Profile" class="w-full h-full object-cover">
            <span *ngIf="!previewUrl" class="text-5xl text-gray-500">
              <i class="fas fa-user"></i>
            </span>
          </div>
          <div class="absolute -bottom-2 -right-2 w-10 h-10 bg-red-600 rounded-full flex items-center justify-center cursor-pointer hover:bg-red-700 transition-colors z-20 upload-btn">
            <label for="avatar" class="cursor-pointer w-full h-full flex items-center justify-center">
              <i class="fas fa-camera text-white"></i>
              <input
                type="file"
                id="avatar"
                class="hidden"
                (change)="onFileSelected($event)"
                accept="image/*">
            </label>
          </div>
        </div>

        <!-- Profile Form -->
        <div class="flex-1">
          <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="form-group">
                <label for="username" class="font-samurai block text-sm font-medium mb-2 text-red-400">USERNAME</label>
                <div class="relative">
                  <input
                    type="text"
                    id="username"
                    formControlName="username"
                    class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white">
                  <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
                </div>
              </div>

              <div class="form-group">
                <label for="name" class="font-samurai block text-sm font-medium mb-2 text-red-400">FULL NAME</label>
                <div class="relative">
                  <input
                    type="text"
                    id="name"
                    formControlName="name"
                    class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white">
                  <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
                </div>
              </div>

              <div class="form-group md:col-span-2">
                <label for="email" class="font-samurai block text-sm font-medium mb-2 text-red-400">EMAIL</label>
                <div class="relative">
                  <input
                    type="email"
                    id="email"
                    formControlName="email"
                    class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white">
                  <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
                </div>
              </div>

              <div class="form-group">
                <label for="password" class="font-samurai block text-sm font-medium mb-2 text-red-400">NEW PASSWORD</label>
                <div class="relative">
                  <input
                    type="password"
                    id="password"
                    formControlName="password"
                    class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white"
                    placeholder="Leave blank to keep current">
                  <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
                </div>
              </div>

              <div class="form-group">
                <label for="confirmPassword" class="font-samurai block text-sm font-medium mb-2 text-red-400">CONFIRM PASSWORD</label>
                <div class="relative">
                  <input
                    type="password"
                    id="confirmPassword"
                    formControlName="confirmPassword"
                    class="w-full px-4 py-3 bg-gray-800 border border-gray-700 focus:border-red-500 rounded-none text-white"
                    placeholder="Confirm new password">
                  <div class="absolute right-0 top-0 h-full w-2 bg-red-600 transform -skew-y-6"></div>
                </div>
              </div>
            </div>

            <!-- Alert Messages -->
            <div *ngIf="submitSuccess" class="mt-6 p-3 bg-green-900 border border-green-600 text-green-400 rounded-none animate-fade-in">
              <i class="fas fa-check-circle mr-2"></i> Profile updated successfully!
            </div>

            <div *ngIf="submitError" class="mt-6 p-3 bg-red-900 border border-red-600 text-red-400 rounded-none animate-fade-in">
              <i class="fas fa-exclamation-circle mr-2"></i> {{ submitError }}
            </div>

            <!-- Submit Button -->
            <div class="mt-6">
              <button
                type="submit"
                class="font-kill-the-noise bg-gradient-to-r from-red-800 to-red-600 hover:from-red-900 hover:to-red-700 text-white border-0 rounded-none px-8 py-4 text-lg font-bold tracking-wider transform hover:translate-y-[-2px] transition-transform inline-block"
                [disabled]="loading || !profileForm.valid">
                <span *ngIf="loading" class="flex items-center">
                  <i class="fas fa-spinner fa-spin mr-2"></i>
                  SAVING...
                </span>
                <span *ngIf="!loading">
                  SAVE CHANGES
                </span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Game Statistics Section -->
      <div class="mt-10 border-t border-red-900 pt-8">
        <h2 class="font-kill-the-noise text-2xl text-red-500 mb-6 transform -skew-x-12">BATTLE STATISTICS</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-gray-800 border border-gray-700 p-6 rounded-none hover:border-red-600 transition-all duration-300 group">
            <div class="flex items-center justify-between">
              <div class="text-4xl text-red-500">
                <i class="fas fa-trophy"></i>
              </div>
              <div class="text-3xl font-kill-the-noise text-white">{{ user?.points || 0 }}</div>
            </div>
            <div class="mt-2 font-samurai text-gray-400 text-sm">TOTAL POINTS</div>
          </div>

          <div class="bg-gray-800 border border-gray-700 p-6 rounded-none hover:border-red-600 transition-all duration-300 group">
            <div class="flex items-center justify-between">
              <div class="text-4xl text-red-500">
                <i class="fas fa-gamepad"></i>
              </div>
              <div class="text-3xl font-kill-the-noise text-white">0</div>
            </div>
            <div class="mt-2 font-samurai text-gray-400 text-sm">GAMES PLAYED</div>
          </div>

          <div class="bg-gray-800 border border-gray-700 p-6 rounded-none hover:border-red-600 transition-all duration-300 group">
            <div class="flex items-center justify-between">
              <div class="text-4xl text-red-500">
                <i class="fas fa-medal"></i>
              </div>
              <div class="text-3xl font-kill-the-noise text-white">0</div>
            </div>
            <div class="mt-2 font-samurai text-gray-400 text-sm">VICTORIES</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
