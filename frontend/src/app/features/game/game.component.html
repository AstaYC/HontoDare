<!-- src/app/features/game/game.component.html -->
<div class="flex justify-center items-center h-screen bg-gray-100">
  <div class="w-full max-w-4xl bg-white p-8 rounded-lg shadow-md space-y-6">
    <h2 class="text-2xl font-semibold text-gray-700 text-center">Game Room</h2>

    <!-- Strict Chat (Yes/No Questions) -->
    <div class="bg-gray-50 p-4 rounded-lg shadow-md">
      <h3 class="text-lg font-medium text-gray-900">Strict Chat (Yes/No Questions)</h3>
      <ul class="h-48 overflow-y-auto">
        <li *ngFor="let message of gameplayMessages" class="mb-2">
          <strong>{{ message.sender }}:</strong> {{ message.content }}
        </li>
      </ul>
      <form (submit)="sendGameplayQuestion()" class="flex">
        <input [(ngModel)]="questionInput" placeholder="Ask a yes/no question..." class="flex-grow p-2 border rounded-l-md focus:outline-none focus:ring focus:ring-indigo-300" />
        <button type="submit" class="py-2 px-4 bg-indigo-600 text-white rounded-r-md hover:bg-indigo-500 transition duration-300 ease-in-out">
          Send
        </button>
      </form>
    </div>

    <!-- Free Chat -->
    <div class="bg-gray-50 p-4 rounded-lg shadow-md">
      <h3 class="text-lg font-medium text-gray-900">Free Chat</h3>
      <ul class="h-48 overflow-y-auto">
        <li *ngFor="let message of freeChatMessages" class="mb-2">
          <strong>{{ message.sender }}:</strong> {{ message.content }}
        </li>
      </ul>
      <form (submit)="sendFreeChatMessage()" class="flex">
        <input [(ngModel)]="freeChatInput" placeholder="Type a message..." class="flex-grow p-2 border rounded-l-md focus:outline-none focus:ring focus:ring-indigo-300" />
        <button type="submit" class="py-2 px-4 bg-indigo-600 text-white rounded-r-md hover:bg-indigo-500 transition duration-300 ease-in-out">
          Send
        </button>
      </form>
    </div>
  </div>
</div>
