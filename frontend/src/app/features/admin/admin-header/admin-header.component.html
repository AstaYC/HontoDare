<nav class="bg-black border-b border-red-800 sticky top-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/admin/home" class="flex items-center group">
          <div class="relative overflow-hidden mr-2">
            <img src="assets/img/HontoDare.png" alt="HontoDare Logo" class="h-10 w-auto transform hover:scale-110 transition-transform duration-300" />
            <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
          </div>
          <span class="font-kill-the-noise text-red-600 text-xl transform -skew-x-12 group-hover:text-red-500 transition-colors duration-300 animate-pulse-slow">
            HontoDare Admin
          </span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-4">
        <a
          routerLink="/home"
          routerLinkActive="text-red-500 border-b-2 border-red-600"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white relative nav-link"
        >
          <span class="relative z-10">Home</span>
          <span class="nav-highlight"></span>
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="text-red-500 border-b-2 border-red-600"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white relative nav-link"
        >
          <span class="relative z-10">Users</span>
          <span class="nav-highlight"></span>
        </a>
        <a
          routerLink="/admin/rooms"
          routerLinkActive="text-red-500 border-b-2 border-red-600"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white relative nav-link"
        >
          <span class="relative z-10">Game Rooms</span>
          <span class="nav-highlight"></span>
        </a>
        <a
          routerLink="/admin/characters"
          routerLinkActive="text-red-500 border-b-2 border-red-600"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white relative nav-link"
        >
          <span class="relative z-10">Characters</span>
          <span class="nav-highlight"></span>
        </a>
      </div>

      <!-- User Menu -->
      <div class="flex items-center">
        <div class="relative mr-4">
          <button class="text-gray-400 hover:text-white p-2 notification-btn">
            <i class="fas fa-bell"></i>
            <span class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center bg-red-600 text-white text-xs rounded-full notification-badge">
              {{ notificationCount }}
            </span>
          </button>
        </div>

        <div class="h-8 w-8 border-2 border-red-600 rounded-full overflow-hidden avatar-container">
          <img src="assets/img/admin-avatar.jpg" alt="Admin" class="h-full w-full object-cover" />
        </div>

        <button
          class="md:hidden ml-4 text-gray-400 hover:text-white mobile-menu-btn"
          (click)="toggleMenu()"
        >
          <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-gray-900 border-t border-red-800 mobile-menu">
    <div class="container mx-auto px-4 py-2">
      <div class="flex flex-col space-y-1">
        <a
          routerLink="/admin/home"
          routerLinkActive="text-red-500 bg-gray-800"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white mobile-nav-link"
          (click)="toggleMenu()"
        >
          <i class="fas fa-home mr-2"></i>
          Home
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="text-red-500 bg-gray-800"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white mobile-nav-link"
          (click)="toggleMenu()"
        >
          <i class="fas fa-users mr-2"></i>
          Users
        </a>
        <a
          routerLink="/admin/rooms"
          routerLinkActive="text-red-500 bg-gray-800"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white mobile-nav-link"
          (click)="toggleMenu()"
        >
          <i class="fas fa-door-open mr-2"></i>
          Game Rooms
        </a>
        <a
          routerLink="/admin/tournaments"
          routerLinkActive="text-red-500 bg-gray-800"

          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white mobile-nav-link"
          (click)="toggleMenu()"
        >
          <i class="fas fa-sign-out-alt mr-2"></i>
          Logout
        </a>
      </div>
    </div>
