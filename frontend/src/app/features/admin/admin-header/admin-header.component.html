<nav class="bg-black border-b border-gray-800 sticky top-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/admin/dashboard" class="flex items-center">
          <img src="assets/img/HontoDare.png" alt="HontoDare Logo" class="h-10 w-auto mr-2" />
          <span class="font-kill-the-noise text-red-600 text-xl transform -skew-x-12">
            HontoDare Admin
          </span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-4">
        <a
          routerLink="/admin/dashboard"
          routerLinkActive="text-red-500 border-b-2 border-red-600"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white"
        >
          Dashboard
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="text-red-500 border-b-2 border-red-600"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white"
        >
          Users
        </a>
        <a
          routerLink="/admin/rooms"
          routerLinkActive="text-red-500 border-b-2 border-red-600"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white"
        >
          Game Rooms
        </a>
          <a
                  routerLink="/admin/characters"
                  routerLinkActive="bg-gray-800"
                  class="flex items-center px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded-md transition-colors duration-200"
          >
              <i class="fas fa-theater-masks mr-3"></i>
              <span>Characters</span>
          </a>
      </div>

      <!-- User Menu -->
      <div class="flex items-center">
        <div class="relative mr-2">
          <button class="text-gray-400 hover:text-white p-2">
            <i class="fas fa-bell"></i>
          </button>
          <span class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center bg-red-600 text-white text-xs rounded-full">
            {{ notificationCount }}
          </span>
        </div>

        <div class="h-8 w-8 border border-red-600 rounded-full overflow-hidden">
          <img src="assets/img/admin-avatar.jpg" alt="Admin" class="h-full w-full object-cover" />
        </div>

        <button
          class="md:hidden ml-2 text-gray-400 hover:text-white"
          (click)="toggleMenu()"
        >
          <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-gray-900 border-t border-gray-800">
    <div class="container mx-auto px-4 py-2">
      <div class="flex flex-col space-y-1">
        <a
          routerLink="/admin/dashboard"
          routerLinkActive="text-red-500 bg-gray-800"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white"
          (click)="toggleMenu()"
        >
          <i class="fas fa-home mr-2"></i>
          Dashboard
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="text-red-500 bg-gray-800"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white"
          (click)="toggleMenu()"
        >
          <i class="fas fa-users mr-2"></i>
          Users
        </a>
        <a
          routerLink="/admin/rooms"
          routerLinkActive="text-red-500 bg-gray-800"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white"
          (click)="toggleMenu()"
        >
          <i class="fas fa-door-open mr-2"></i>
          Game Rooms
        </a>
        <a
          routerLink="/admin/tournaments"
          routerLinkActive="text-red-500 bg-gray-800"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white"
          (click)="toggleMenu()"
        >
          <i class="fas fa-trophy mr-2"></i>
          Tournaments
        </a>
        <div class="border-t border-gray-800 my-2"></div>
        <a
          routerLink="/logout"
          class="font-samurai px-3 py-2 text-sm text-gray-400 hover:text-white"
          (click)="toggleMenu()"
        >
          <i class="fas fa-sign-out-alt mr-2"></i>
          Logout
        </a>
      </div>
    </div>
  </div>
</nav>
