<!-- src/app/features/admin/rooms/room-list/room-list.component.html -->
<div class="flex h-screen bg-gray-900">
  <!-- Sidebar -->
  <app-admin-sidebar></app-admin-sidebar>

  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <app-admin-header></app-admin-header>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto p-6">
      <div class="mb-6 flex justify-between items-center">
        <h1 class="text-2xl font-kill-the-noise text-red-600">Rooms Management</h1>
        <a routerLink="/admin/rooms/create" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
          <i class="fas fa-plus mr-2"></i> Add Room
        </a>
      </div>

      <!-- Category Filters -->
      <div class="mb-4 flex items-center space-x-2">
        <span class="text-gray-400">Filter by category:</span>
        <button
          (click)="resetFilter()"
          class="px-3 py-1 bg-gray-700 hover:bg-gray-600 text-white rounded-md text-sm"
        >
          All
        </button>
        <button
          *ngFor="let category of categories"
          (click)="filterByCategory(category)"
          class="px-3 py-1 bg-gray-700 hover:bg-gray-600 text-white rounded-md text-sm"
        >
          {{category}}
        </button>
      </div>

      <div class="bg-gray-800 rounded-lg shadow-lg">
        <div class="table-container">
          <table class="w-full text-left">
            <thead>
            <tr class="border-b border-gray-700">
              <th class="py-3 px-4 text-gray-400 font-medium">Room Name</th>
              <th class="py-3 px-4 text-gray-400 font-medium">Description</th>
              <th class="py-3 px-4 text-gray-400 font-medium">Category</th>
              <th class="py-3 px-4 text-gray-400 font-medium">Max Players</th>
              <th class="py-3 px-4 text-gray-400 font-medium">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngIf="loading">
              <td colspan="5" class="py-8 text-center text-gray-400">Loading rooms...</td>
            </tr>
            <!-- src/app/features/admin/rooms/room-list/room-list.component.html -->
            <!-- Update the table rows in the room-list component -->

            <tr *ngFor="let room of rooms" class="border-b border-gray-700 hover:bg-gray-700">
              <td class="py-3 px-4">
                <div class="flex items-center">
                  <!-- Room Image -->
                  <div class="h-10 w-10 bg-gray-700 rounded overflow-hidden mr-3">
                    <img *ngIf="room.roomPicUrl"
                         [src]="getImageUrl(room.roomPicUrl)"
                         alt="Room thumbnail"
                         class="w-full h-full object-cover">
                    <div *ngIf="!room.roomPicUrl" class="h-full w-full flex items-center justify-center text-gray-400">
                      <i class="fas fa-gamepad"></i>
                    </div>
                  </div>
                  <!-- Room Name -->
                  <span class="text-white font-medium">{{ room.name }}</span>
                </div>
              </td>
              <td class="py-3 px-4 text-white">{{ room.description }}</td>
              <td class="py-3 px-4">
    <span class="px-2 py-1 rounded text-xs bg-blue-900 text-blue-200">
      {{ room.category }}
    </span>
              </td>
              <td class="py-3 px-4 text-white">{{ room.maxPlayers }}</td>
              <td class="py-3 px-4">
                <div class="flex space-x-2">
                  <a [routerLink]="['/admin/rooms/edit', room.id]" class="text-blue-400 hover:text-blue-300">
                    <i class="fas fa-edit"></i>
                  </a>
                  <button (click)="deleteRoom(room.id)" class="text-red-400 hover:text-red-300">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="rooms.length === 0 && !loading">
              <td colspan="5" class="py-8 text-center text-gray-400">No rooms found</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
