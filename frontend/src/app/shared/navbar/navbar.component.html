<header class="bg-black border-b border-red-800">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between py-4">
      <a routerLink="/" class="flex items-center">
        <img class="h-auto max-h-16 w-auto" src="assets/img/HontoDare.png" alt="HontoDare Logo">
      </a>

      <nav class="hidden md:flex">
        <ul class="flex space-x-8">
          <li>
            <a routerLink="/home" routerLinkActive="text-red-500" [routerLinkActiveOptions]="{exact: true}"
               class="font-samurai text-white hover:text-red-500 transition-colors">Home</a>
          </li>
          <li>
            <a routerLink="/rooms" routerLinkActive="text-red-500"
               class="font-samurai text-white hover:text-red-500 transition-colors">Rooms</a>
          </li>
          <li>
            <a routerLink="/profile" routerLinkActive="text-red-500"
               class="font-samurai text-white hover:text-red-500 transition-colors">Profile</a>
          </li>
          <li>
            <a (click)="scrollToHowToPlay()"
               class="font-samurai text-white hover:text-red-500 transition-colors cursor-pointer">How to Play</a>
          </li>
          <li *ngIf="isAdmin">
            <a routerLink="/admin/users" routerLinkActive="text-red-500"
               class="font-samurai text-white hover:text-red-500 transition-colors">Dashboard</a>
          </li>
        </ul>
      </nav>

      <button class="md:hidden text-white" (click)="toggleMenu()">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-gray-900 border-t border-red-900">
    <ul class="py-2">
      <li>
        <a routerLink="/" routerLinkActive="text-red-500" [routerLinkActiveOptions]="{exact: true}"
           class="font-samurai block px-4 py-2 text-white hover:text-red-500 transition-colors">Home</a>
      </li>
      <li>
        <a routerLink="/rooms" routerLinkActive="text-red-500"
           class="font-samurai block px-4 py-2 text-white hover:text-red-500 transition-colors">Rooms</a>
      </li>
      <li>
        <a routerLink="/profile" routerLinkActive="text-red-500"
           class="font-samurai block px-4 py-2 text-white hover:text-red-500 transition-colors">Profile</a>
      </li>
      <li>
        <a (click)="scrollToHowToPlay(); toggleMenu();"
           class="font-samurai block px-4 py-2 text-white hover:text-red-500 transition-colors cursor-pointer">How to Play</a>
      </li>
    </ul>
  </div>
</header>
